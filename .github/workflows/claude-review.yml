# Claude reviews every pull request: automatically when it is opened, reopened, marked
# ready or pushed to, and again on demand when the repo owner comments "@claude review".
# One Messages API call per review (.github/scripts/claude_review.py), billed to the
# Anthropic API key in the ANTHROPIC_API_KEY repo secret. No Claude Code involved.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  review:
    # Fork-only. PRs from other forks get no secrets, so they are skipped.
    if: >-
      github.repository == 'markbarnes/huehub-py' &&
      (
        (
          github.event_name == 'pull_request' &&
          !github.event.pull_request.draft &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          startsWith(github.event.comment.body, '@claude review') &&
          github.event.comment.author_association == 'OWNER'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # The script runs from the default branch, so a PR can't change what runs with
      # the API key. The PR head goes in pr/ and is only read, never executed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          path: pr
          fetch-depth: 1
          persist-credentials: false

      # setup-uv publishes no floating major tags; pin the release commit.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # Skips until the script exists on the default branch (the PR that adds it).
      - name: Review
        if: hashFiles('.github/scripts/claude_review.py') != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_CHECKOUT: pr
        run: >-
          uv run --no-project --python 3.14
          --with anthropic==1.17.0 --with pydantic==2.13.4
          python .github/scripts/claude_review.py
